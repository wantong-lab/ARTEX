name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARTEX_PG_DSN: postgres://artex:artex@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: migrate test database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          for f in db/migrations/*.sql; do psql "$ARTEX_PG_DSN" -f "$f"; done
      - name: test
        run: go test -p 1 ./... -count=1
      - name: api smoke
        run: |
          go build -o /tmp/artex ./cmd/artex
          /tmp/artex -addr 127.0.0.1:18899 -data /tmp/artex-smoke -proxy "" > /tmp/artex-smoke.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18899/api/health >/dev/null && break; sleep 1; done
          SMOKE_BASE=http://127.0.0.1:18899 python3 scripts/smoke/api_smoke.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: build
        working-directory: web
        run: npm run build